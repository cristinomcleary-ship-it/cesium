</style><header><h1>临建代码独立验证 — 合成地面，不代表真实倾斜摄影验收</h1><div class="tools"><button id="load-synthetic">加载合成场景</button><button id="seed-road">填入便道演示图纸/参数</button><button id="seed-hardening">填入硬化参数</button><button id="load-private">加载本地私有模型</button><button id="reload-plans">重载内存方案</button><button id="look-top">俯视</button><button id="look-oblique">斜视</button><button id="toggle-time">切换夜间</button></div><p>原生产服务和数据不接入。方案存放本页内存，刷新清空；“重载内存方案”测试读取与恢复流程。合成坐标原点：121°E，31°N；合成地面顶0 m，演示设计顶2 m。</p><p id="fixture-status">正在启动独立Viewer和真实临建面板…</p><p id="fixture-errors" role="alert"></p></header><div id="scene"></div><div id="panel"></div><div class="synthetic-lighting"><label>独立材质小样亮度<input id="synthetic-brightness" type="range" min="50" max="200" step="10" value="100"/><output id="synthetic-value">100%</output></label><small>白/红为金属粗糙度，绿/黄为SpecGloss，蓝无顶点法线；私有模型请用右侧模型亮度。</small></div><div id="notice" role="status">本页仅用于独立代码验证；真实摄影与现场性能须另行验收。</div><script type="module" src="/app.ts"></script></html>
